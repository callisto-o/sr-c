[Script]
yandex = type=http-request,engine=auto,script-path=claude-2.js,pattern=^https?:\/\/(?:[^\/]*maps\.yandex(?:-net)?\.(?:net|ru)|yandex\.ru|avatars\.mds\.yandex\.net)(:\d+)?\/.*,max-size=524288,binary-mode=true,timeout=10,script-update-interval=0,enable=true

# Новый скрипт для SoundCloud (request - это вроде бы запрос iphone)
soundcloud = type=http-request,engine=auto,script-path=soundcloud-ads-3.js,pattern=^https?:\/\/api-mobile\.soundcloud\.com\/.*,max-size=524288,binary-mode=true,timeout=10,script-update-interval=0,enable=true

# Новый скрипт для SoundCloud (response - это вроде бы ответ сервера)
soundcloud-response = type=http-response,engine=auto,requires-body=true,script-path=soundcloud-response.js,pattern=^https?:\/\/(api-mobile\.soundcloud\.com|graph\.soundcloud\.com)\/.*,max-size=1048576,timeout=10,enable=true

